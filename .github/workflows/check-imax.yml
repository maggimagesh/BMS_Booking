# Watches BookMyShow for IMAX seats opening on the watched weekday (Mondays by
# default - set the WATCH_WEEKDAY input to change it).
name: Check IMAX Availability

on:
  schedule:
    # Every 15 min, on off-round minutes. GitHub's scheduler is best-effort
    # and silently drops ticks - this workflow missed every scheduled run at
    # both ':00' and ':07' after being registered. Four ticks an hour means a
    # dropped one costs 15 minutes instead of a full hour. Round minutes
    # (:00, :15, :30, :45) are the most contended, so they are avoided.
    # The job makes exactly ONE request to BookMyShow per run.
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      watch_dates:
        description: 'Pin exact dates, e.g. 2026-08-15,2026-08-22. Blank = use the weekday rule below.'
        required: false
        default: ''
      weekday:
        description: 'Weekday to watch (name or 0=Sunday..6=Saturday). Blank = repo variable WATCH_WEEKDAY, else monday.'
        required: false
        default: ''
      dates:
        description: 'How many upcoming matching dates to watch (1 = the coming one only)'
        required: false
        default: ''
      fingerprint_seed:
        description: 'Replay a specific hardware profile (seed from a run log). Blank = derive from the run id.'
        required: false
        default: ''
      seats:
        description: 'How many seats together to look for. Blank = repo variable SEATS, else 2.'
        required: false
        default: ''
      show_time:
        description: 'Which show to read seats for, e.g. 19:30 or 7:30 PM. Blank = repo variable SHOW_TIME, else 19:30.'
        required: false
        default: ''

permissions:
  contents: write

# Never let two runs race on state.json. Queue rather than cancel, so a run
# that might catch the opening is not thrown away.
concurrency:
  group: imax-check
  cancel-in-progress: false

jobs:
  check:
    # Kill switch. Create a repo variable named STOP (Settings -> Secrets and
    # variables -> Actions -> Variables) and every run - scheduled or manual -
    # is skipped without starting a runner. Delete the variable to resume.
    # check.js enforces the same rule from its own env, for runs started
    # outside Actions.
    if: ${{ vars.STOP == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # checkout pins the tree to the SHA that triggered this run, which may
      # predate state written by an earlier run. Take state.json from the
      # branch tip so "already notified" markers are current - otherwise a
      # stale map re-sends an alert that has already gone out. Code and
      # workflow stay at the trigger SHA; only state is advanced.
      - name: Sync state to branch tip
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "origin/${GITHUB_REF_NAME}" -- state.json || \
            echo "No state.json on the branch tip yet; starting fresh."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      # The seat picker's tests need no network and no browser, and take under
      # a second. Cheap insurance against a run that reads the page correctly
      # and then recommends the wrong seats.
      - name: Test
        run: npm test

      # Cache the browser download - ~150 MB, and this job runs often.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}

      # Real Google Chrome is the preferred target (better fingerprint parity
      # than bundled Chromium); Chromium is installed as the fallback.
      - name: Install browsers
        run: |
          npx playwright install --with-deps chromium
          npx playwright install chrome || echo "Chrome channel unavailable; using Chromium"

      - name: Check availability
        env:
          TARGET_URL_BASE: ${{ vars.TARGET_URL_BASE }}
          # Scheduled runs have no inputs, so they fall through to the repo
          # variables (Settings -> Secrets and variables -> Actions -> Variables).
          # Retarget the checker by editing those - no code change, no push.
          STOP: ${{ vars.STOP }}
          WATCH_DATES: ${{ github.event.inputs.watch_dates || vars.WATCH_DATES }}
          WATCH_WEEKDAY: ${{ github.event.inputs.weekday || vars.WATCH_WEEKDAY }}
          DATES_TO_CHECK: ${{ github.event.inputs.dates || vars.DATES_TO_CHECK }}
          BLOCK_ALERT_THRESHOLD: '3'
          # Seat check: when a watched date is on sale, read the seat map for
          # the show nearest SHOW_TIME and put the best SEATS-together in the
          # alert. Set the SEAT_CHECK variable to 0 to turn it off.
          SEATS: ${{ github.event.inputs.seats || vars.SEATS }}
          SHOW_TIME: ${{ github.event.inputs.show_time || vars.SHOW_TIME }}
          SHOW_TIME_WINDOW: ${{ vars.SHOW_TIME_WINDOW }}
          SEAT_CHECK: ${{ vars.SEAT_CHECK }}
          SEAT_IDEAL_ROW: ${{ vars.SEAT_IDEAL_ROW }}
          SEAT_OPTIONS: ${{ vars.SEAT_OPTIONS }}
          # Blank falls back to GITHUB_RUN_ID + attempt, so each hourly run
          # presents a different machine. Set it to a seed printed in an earlier
          # log to reproduce that run's exact fingerprint.
          FINGERPRINT_SEED: ${{ github.event.inputs.fingerprint_seed }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          # Separate template for "checker is blocked" mail.
          EMAILJS_FAILURE_TEMPLATE_ID: ${{ secrets.EMAILJS_FAILURE_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          # Optional residential proxy - the real fix if GitHub's IPs get banned.
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: node check.js

      # Screenshot + HTML of whatever BookMyShow returned when it blocked us.
      # This is how you find out *why* a run failed.
      - name: Upload debug artifacts
        if: always() && hashFiles('debug/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug/
          retention-days: 5

      # Persist "already notified" markers so you get one alert per date, not
      # one every hour. Runs even when the check step exits non-zero,
      # because the consecutive-block counter lives in state.json too.
      - name: Commit updated state
        if: always()
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # state.json is rewritten wholesale every run, so a concurrent push
          # makes rebase conflict on every line rather than merge. Never
          # rebase it: keep the state this run computed, reset onto the branch
          # tip, and replay the file there. This run read the tip's state at
          # startup and the concurrency group keeps runs serialised, so our
          # copy is the newest - last writer wins is the correct outcome.
          cp state.json "${RUNNER_TEMP}/state.ours.json"

          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp "${RUNNER_TEMP}/state.ours.json" state.json

            if git diff --quiet -- state.json; then
              echo "No state change."
              exit 0
            fi

            git add state.json
            git commit -m "Update state [skip ci]"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed."
              exit 0
            fi

            echo "Push rejected (attempt $i) - another run pushed first; replaying."
            sleep $(( i * 3 ))
          done

          echo "Could not push state after 5 attempts." >&2
          exit 1
